name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avo
          POSTGRES_PASSWORD: avo_dev_password
          POSTGRES_DB: avo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U avo" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://avo:avo_dev_password@127.0.0.1:5433/avo_test
      TEST_DATABASE_URL: postgresql://avo:avo_dev_password@127.0.0.1:5433/avo_test
      E2E_DATABASE_URL: postgresql://avo:avo_dev_password@127.0.0.1:5433/avo_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Create e2e database
        run: PGPASSWORD=avo_dev_password psql -h 127.0.0.1 -p 5433 -U avo -d avo_test -c "CREATE DATABASE avo_e2e"
      - name: Prisma client
        run: npm run db:generate -w @avo/api
      - name: Apply the committed migrations with Prisma (the real deploy path)
        run: npm run db:migrate -w @avo/api
      - name: Schema drift check (migrations must match schema.prisma)
        run: npm run db:check -w @avo/api
      - run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
