# Local PostgreSQL for Azhiim Virtual Office. The app itself runs with `npm run dev` (see README).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: avo
      POSTGRES_PASSWORD: avo_dev_password # local development only; change it for anything shared
      POSTGRES_DB: avo
    ports:
      - "127.0.0.1:5432:5432" # bound to localhost only
    volumes:
      - avo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avo -d avo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  avo-db:
